  spring-app:
    image: spring-service:1.0
    ports:
      - "8080:8080"
    networks:
      aeron-net:
        ipv4_address: 172.28.0.13
    environment:
      - CLUSTER_ADDRESSES=172.28.0.10
      - EGRESS_IP=172.28.0.13
    shm_size: "512m"
    depends_on:
      - node0



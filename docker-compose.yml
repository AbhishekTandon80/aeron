version: '3.8'

networks:
  aeron-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:

  node0:
    image: aeron-cache:1.0
    environment:
    - NODE_ID=0
    - CLUSTER_ADDRESSES=172.28.0.10
    volumes:
      - ./node0-data:/data
    container_name: aeron-node0
    shm_size: "512m"
    networks:
      aeron-net:
        ipv4_address: 172.28.0.10

